# Hook config is pulled from the pinned org-hooks ref; this stub plus the
# repo-local commands below is all this repo carries.
# See ~/src/org-hooks/examples/lefthook.stub.yml.
remotes:
  - git_url: /home/john/src/org-hooks
    ref: main
    refetch: true
    configs:
      - lefthook-common.yml
      - profiles/ts.yml

# Sourced before every hook — exports ORG_HOOKS so the remote scripts resolve.
# Absolute path: the generated git hook sources this with POSIX `.`, which only
# searches the cwd when the path contains a slash (a bare name fails at commit).
rc: /home/john/src/checklist/lefthook-rc.sh

# ── Repo-local commands ──────────────────────────────────────────────────────
pre-commit:
  commands:
    # jazz-tools is fully removed from the frontend (D8) and the provider/waist were
    # renamed off "jazz", so the inherited ts-jazz-waist gate (bans jazz-tools/react
    # imports) can never fire here. Skip it — lefthook merges local `skip:` over remote.
    ts-jazz-waist:
      skip: true
    # Full unit suite (frontend + backend) — fast, deterministic.
    unit-tests:
      glob: "*.{ts,tsx}"
      run: npm run test:run
    # Playwright e2e drives the real app; its webServer auto-starts npm run dev.
    e2e-tests:
      glob: "*.{ts,tsx,html}"
      run: npm run test:e2e
