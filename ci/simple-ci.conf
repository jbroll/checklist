# simple-ci project config for checklist.
# Sourced by the sci client when run from this directory.

# Ordered list of CI hosts to try — first reachable one wins.
CI_HOSTS=(
    "gpu:http://gpu:8080"
    "home.rkroll.com:tunnel:8080"
)

# Defaults (used when no CI_HOSTS entry is reachable).
CI_HOST=gpu
CI_REMOTE_SCRIPT=~/src/simple-ci/ci-rsync.sh
CI_SERVER_URL=http://gpu:8080

# --delete makes the CI worktree exactly match the pushed tree (the worktree is
# created at origin/HEAD then the working tree is rsynced on top). .git is
# excluded and gitignored files are protected by the client's gitignore filter,
# so node_modules is never deleted. Force-include the gitignored backend/.env so
# ci/setup.sh's write isn't clobbered by the rsync.
CI_RSYNC_ARGS="--delete"
