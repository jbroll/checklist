#!/bin/bash
# Deploy configuration for Kjekit Marketing Website (kjekit.com)
# This deploys the static marketing/landing page

# === REQUIRED VARIABLES ===

# Deployment modules (static site only)
export DEPLOY_TYPES="letsencrypt apache"

# Application identity
export APP_NAME="kjekit-www"
export DOMAIN_NAME="kjekit.com"

# Remote server
export REMOTE_HOST="kjekit.com"
export REMOTE_USER="john"

# === APACHE MODULE (Static Mode) ===

# Mode: static (no build, no proxy)
export APACHE_MODE="static"

# Server alias for CheckList brand landing page
export APACHE_SERVER_ALIASES="checklist.rkroll.com"

# Static content (no build needed)
export APACHE_CONTENT_DIR="${PROJECT_DIR}"
export APACHE_BUILD_ENABLED="no"
export APACHE_WEB_ROOT="/var/www/kjekit-www"

# Features
export APACHE_CACHE_STATIC="yes"
export APACHE_SECURITY_HEADERS="yes"

# === LETSENCRYPT MODULE ===

export LETSENCRYPT_EMAIL="support@kjekit.com"
