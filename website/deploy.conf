#!/bin/bash
# Deploy configuration for CheckList Marketing Website (checklist.rkroll.com)
# This deploys the static marketing/landing page

# === REQUIRED VARIABLES ===

# Deployment modules (static site only)
export DEPLOY_TYPES="letsencrypt apache"

# Application identity
export APP_NAME="checklist-www"
export DOMAIN_NAME="checklist.rkroll.com"

# Remote server
export REMOTE_HOST="checklist.rkroll.com"
export REMOTE_USER="john"

# === APACHE MODULE (Static Mode) ===

# Mode: static (no build, no proxy)
export APACHE_MODE="static"

# Server alias for kjekit brand
export APACHE_SERVER_ALIASES="kjekit.com"

# Static content (no build needed)
export APACHE_CONTENT_DIR="${PROJECT_DIR}"
export APACHE_BUILD_ENABLED="no"
export APACHE_WEB_ROOT="/var/www/checklist-www"

# Features
export APACHE_CACHE_STATIC="yes"
export APACHE_SECURITY_HEADERS="yes"

# === LETSENCRYPT MODULE ===

export LETSENCRYPT_EMAIL="support@checklist.rkroll.com"
