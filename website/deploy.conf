#!/bin/bash
# Deploy configuration for BubbleList Marketing Website (bubblelist.rkroll.com)
# This deploys the static marketing/landing page

# === REQUIRED VARIABLES ===

# Deployment modules (static site only)
export DEPLOY_TYPES="letsencrypt apache"

# Application identity
export APP_NAME="bubblelist-www"
export DOMAIN_NAME="bubblelist.rkroll.com"

# Remote server
export REMOTE_HOST="bubblelist.rkroll.com"
export REMOTE_USER="john"

# === APACHE MODULE (Static Mode) ===

# Mode: static (no build, no proxy)
export APACHE_MODE="static"

# Static content (no build needed)
export APACHE_CONTENT_DIR="."
export APACHE_BUILD_ENABLED="no"
export APACHE_WEB_ROOT="/var/www/bubblelist-www"

# Features
export APACHE_CACHE_STATIC="yes"
export APACHE_SECURITY_HEADERS="yes"

# === LETSENCRYPT MODULE ===

export LETSENCRYPT_EMAIL="admin@rkroll.com"
