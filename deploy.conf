#!/bin/bash
# Deploy configuration for Kjekit App (app.kjekit.com)
# This deploys the React frontend + Apache with API proxy
# Marketing site is at kjekit.com (separate deployment)

# === REQUIRED VARIABLES ===

# Deployment modules (frontend only - backend deployed separately)
export DEPLOY_TYPES="letsencrypt apache"

# Application identity
export APP_NAME="kjekit-app"
export DOMAIN_NAME="app.kjekit.com"

# Remote server
export REMOTE_HOST="app.kjekit.com"
export REMOTE_USER="john"

# === APACHE MODULE (Unified - Hybrid Mode) ===

# Mode: hybrid (static frontend + API proxy to backend)
export APACHE_MODE="hybrid"

# Frontend static content
export APACHE_CONTENT_DIR="."
export APACHE_BUILD_CMD="npm run build"
export APACHE_BUILD_ENABLED="yes"
export APACHE_WEB_ROOT="/var/www/kjekit-app"

# Backend API proxy (proxies to backend service)
export APACHE_PROXY_RULES="/api:3001:/api"

# Features
export APACHE_SPA_MODE="yes"
export APACHE_CACHE_STATIC="yes"
export APACHE_SECURITY_HEADERS="yes"

# === LETSENCRYPT MODULE ===

# SSL certificate configuration
export LETSENCRYPT_EMAIL="support@kjekit.com"
