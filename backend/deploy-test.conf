#!/bin/bash
# Deploy configuration for Kjekit Test Backend (BetterAuth API)
# This deploys the Express backend service for testing

# === REQUIRED VARIABLES ===

# Deployment modules (backend only)
export DEPLOY_TYPES="express_app"

# Application identity
export APP_NAME="kjekit-api-test"
export DOMAIN_NAME="checklist-test.rkroll.com"

# Remote server
export REMOTE_HOST="checklist-test.rkroll.com"
export REMOTE_USER="john"

# === EXPRESS APP MODULE (Backend) ===

# Backend configuration
export EXPRESS_APP_PORT="3002"
export EXPRESS_APP_USER="kjekit"
export EXPRESS_APP_GROUP="kjekit"
export EXPRESS_APP_BASE_PATH="/var/lib"
export EXPRESS_APP_DATA_PATH="/var/lib/kjekit-api-test-data"  # Separate from prod
export EXPRESS_APP_CONFIG_PATH="/var/lib"  # Store .env in data dir (no sudo needed)
export EXPRESS_APP_MAIN_SCRIPT="dist/index.js"

# Node.js settings
export EXPRESS_APP_NODE_ENV="production"
export EXPRESS_APP_NODE_OPTIONS="--enable-source-maps --max-old-space-size=512"
