#!/bin/bash
# Deploy configuration for BubbleList Backend (BetterAuth API)
# This deploys the Express backend service

# === REQUIRED VARIABLES ===

# Deployment modules (backend only)
export DEPLOY_TYPES="express_app"

# Application identity
export APP_NAME="bubblelist-api"
export DOMAIN_NAME="bubblelist-app.rkroll.com"

# Remote server
export REMOTE_HOST="bubblelist-app.rkroll.com"
export REMOTE_USER="john"

# === EXPRESS APP MODULE (Backend) ===

# Backend configuration
export EXPRESS_APP_PORT="3001"
export EXPRESS_APP_USER="bubblelist"
export EXPRESS_APP_GROUP="bubblelist"
export EXPRESS_APP_BASE_PATH="/var/lib"
export EXPRESS_APP_DATA_PATH="/var/lib/bubblelist-api-data"  # Separate from app path
export EXPRESS_APP_CONFIG_PATH="/var/lib"  # Store .env in data dir (no sudo needed)
export EXPRESS_APP_MAIN_SCRIPT="dist/index.js"

# Node.js settings
export EXPRESS_APP_NODE_ENV="production"
export EXPRESS_APP_NODE_OPTIONS="--enable-source-maps --max-old-space-size=512"
