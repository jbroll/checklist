#!/bin/bash
# Deploy configuration for CheckList Production Backend (BetterAuth API)
# This deploys the Express backend service for production

# === REQUIRED VARIABLES ===

# Deployment modules (backend only)
export DEPLOY_TYPES="express_app"

# Application identity
export APP_NAME="checklist-api"
export DOMAIN_NAME="checklist-app.rkroll.com"

# Remote server
export REMOTE_HOST="checklist-app.rkroll.com"
export REMOTE_USER="john"

# === EXPRESS APP MODULE (Backend) ===

# Backend configuration
export EXPRESS_APP_PORT="3001"
export EXPRESS_APP_USER="checklist"
export EXPRESS_APP_GROUP="checklist"
export EXPRESS_APP_BASE_PATH="/var/lib"
export EXPRESS_APP_DATA_PATH="/var/lib/checklist-api-data"
export EXPRESS_APP_CONFIG_PATH="/var/lib"
export EXPRESS_APP_MAIN_SCRIPT="dist/index.js"

# Node.js settings
export EXPRESS_APP_NODE_ENV="production"
export EXPRESS_APP_NODE_OPTIONS="--enable-source-maps --max-old-space-size=512"
