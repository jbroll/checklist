#!/bin/bash
# Deploy configuration for Kjekit Test App (checklist-test.rkroll.com)
# This deploys the React frontend + Apache with API proxy for testing

# === REQUIRED VARIABLES ===

# Deployment modules (frontend only - backend deployed separately)
export DEPLOY_TYPES="letsencrypt apache"

# Application identity
export APP_NAME="kjekit-app-test"
export DOMAIN_NAME="checklist-test.rkroll.com"

# Remote server
export REMOTE_HOST="checklist-test.rkroll.com"
export REMOTE_USER="john"

# === APACHE MODULE (Unified - Hybrid Mode) ===

# Mode: hybrid (static frontend + API proxy to backend)
export APACHE_MODE="hybrid"

# No server aliases for test environment
export APACHE_SERVER_ALIASES=""

# Frontend static content
export APACHE_CONTENT_DIR="."

# Hosted rowboat data plane, baked into the bundle at build time from the test tenant's state file.
TENANT_DB_ID="$(node -p "require('$(dirname "${BASH_SOURCE[0]}")/rowboat-tenant.test.json').databaseId")"
export VITE_ROWBOAT_SYNC_BASE="https://rowboat.rkroll.com/db/${TENANT_DB_ID:?run npm run provision:test first}/api/sync"

export APACHE_BUILD_CMD="npm run build"
export APACHE_BUILD_ENABLED="yes"
export APACHE_WEB_ROOT="/var/www/kjekit-app-test"

# Backend API proxy (proxies to backend service)
export APACHE_PROXY_RULES="/api:${APP_PORT:?APP_PORT must be set — deploy via deploy-full.sh}:/api"

# Features
export APACHE_SPA_MODE="yes"
export APACHE_CACHE_STATIC="yes"
export APACHE_SECURITY_HEADERS="yes"

# === LETSENCRYPT MODULE ===

# SSL certificate configuration
export LETSENCRYPT_EMAIL="support@checklist.rkroll.com"
